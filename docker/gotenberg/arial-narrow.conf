<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
  <!-- EMP-D1: template formulir memakai Arial Narrow → Liberation Sans Narrow (metrik sama). -->
  <alias binding="same">
    <family>Arial Narrow</family>
    <accept><family>Liberation Sans Narrow</family></accept>
  </alias>
</fontconfig>
