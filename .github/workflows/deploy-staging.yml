# Migrasi database ke Supabase STAGING (D-030, menjawab OD-7).
# Berjalan saat push ke HRIS/debug/fe-be (alur Git PLAN §6) atau manual dari branch itu saja.
# Migrasi SELALU sebelum kode baru aktif: deploy Vercel (CLI, D-036) baru berjalan setelah migrasi sukses.
name: Deploy staging

on:
  push:
    branches: ["HRIS/debug/fe-be"]
  workflow_dispatch:

# Satu deploy staging pada satu waktu; yang baru menunggu, tidak membatalkan migrasi yang sedang jalan.
concurrency:
  group: deploy-staging
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  migrate:
    name: Migrasi Prisma → Supabase staging
    if: github.ref == 'refs/heads/HRIS/debug/fe-be'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Repository secret (Environments tidak tersedia untuk repo private paket Free).
      # Session pooler Supabase port 5432: runner GitHub tidak punya IPv6 untuk koneksi direct.
      DIRECT_URL: ${{ secrets.STAGING_DIRECT_URL }}
    steps:
      - name: Pastikan secret tersedia
        run: |
          if [ -z "$DIRECT_URL" ]; then
            echo "::error::Secret STAGING_DIRECT_URL belum diisi (Settings → Secrets and variables → Actions)."
            exit 1
          fi
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - name: Status migrasi sebelum deploy
        # Informasi saja: exit code != 0 berarti ada migrasi tertunda, bukan kegagalan.
        working-directory: apps/api
        run: bunx prisma migrate status || true
      - name: Terapkan migrasi (prisma migrate deploy)
        run: bun run db:deploy
      - name: Pastikan skema staging = skema Prisma
        run: bun run db:check

  # D-036: deploy lewat Vercel CLI (bukan integrasi Git/Deploy Hook): repo private milik organisasi
  # tidak bisa dihubungkan ke akun Hobby. Build di runner, lalu unggah hasil prebuilt.
  # Urutan dijamin lewat `needs`: migrasi → api → web (web boleh memakai endpoint api terbaru).
  # Matrix + max-parallel: 1 tidak menjamin urutan (run #36536174711: web selesai sebelum api).
  vercel-api:
    name: Deploy Vercel staging (api)
    needs: migrate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_API }}
    steps:
      - name: Pastikan secret tersedia
        run: |
          if [ -z "$VERCEL_TOKEN" ] || [ -z "$VERCEL_ORG_ID" ] || [ -z "$VERCEL_PROJECT_ID" ]; then
            echo "::error::Secret VERCEL_TOKEN / VERCEL_ORG_ID / VERCEL_PROJECT_ID_API belum diisi."
            exit 1
          fi
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      # Pengaturan project (root directory, env production) diambil dari Vercel.
      - run: bunx vercel@61 pull --yes --environment=production --token "$VERCEL_TOKEN"
      - run: bunx vercel@61 build --prod --token "$VERCEL_TOKEN"
      - name: Deploy prebuilt ke production project staging
        run: bunx vercel@61 deploy --prebuilt --prod --token "$VERCEL_TOKEN"

  vercel-web:
    name: Deploy Vercel staging (web)
    needs: vercel-api
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_WEB }}
    steps:
      - name: Pastikan secret tersedia
        run: |
          if [ -z "$VERCEL_TOKEN" ] || [ -z "$VERCEL_ORG_ID" ] || [ -z "$VERCEL_PROJECT_ID" ]; then
            echo "::error::Secret VERCEL_TOKEN / VERCEL_ORG_ID / VERCEL_PROJECT_ID_WEB belum diisi."
            exit 1
          fi
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      # Pengaturan project (root directory, env production) diambil dari Vercel.
      - run: bunx vercel@61 pull --yes --environment=production --token "$VERCEL_TOKEN"
      - run: bunx vercel@61 build --prod --token "$VERCEL_TOKEN"
      - name: Deploy prebuilt ke production project staging
        run: bunx vercel@61 deploy --prebuilt --prod --token "$VERCEL_TOKEN"
