# CI (PLAN §2, CODEMAP §1): typecheck, lint, batas modul, migrasi dari DB kosong + test, build.
name: CI

on:
  push:
    branches: ["main", "HRIS/**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Typecheck, lint, batas modul, test shared & web, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bunx biome ci .
      - run: bun run check:boundaries
      - run: bun run test:shared
      - run: bun run test:web
      - run: bun run build

  api-db:
    name: Migrasi dari DB kosong + test api
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        # Versi major sama dengan docker-compose.yml & project Supabase (D-023).
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hris
          TZ: UTC
          PGTZ: UTC
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d hris"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/hris
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/hris
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - name: Terapkan semua migrasi ke database kosong
        run: bun run db:deploy
      - name: Pastikan skema Prisma = hasil migrasi (tidak ada migrasi yang lupa dibuat)
        run: bun run db:check
      - run: bun run test:api
